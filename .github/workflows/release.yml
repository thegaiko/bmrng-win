name: build-windows

# Собирает .exe-установщик bmrng на Windows-раннере и публикует его в GitHub
# Releases. electron-updater в приложении берёт обновления оттуда же.
#
# Как выпустить версию:
#   1) поднять "version" в package.json
#   2) git tag vX.Y.Z && git push --tags   (или запустить вручную во вкладке Actions)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      # Подставляем секрет кластера (relay_token). Хранится в GitHub Secrets,
      # не в репозитории. Значение — содержимое src/main/cluster-config.json.
      - name: Inject cluster config
        shell: pwsh
        run: |
          if (-not $env:CLUSTER_CONFIG) { throw "Секрет CLUSTER_CONFIG не задан (gh secret set CLUSTER_CONFIG)" }
          $env:CLUSTER_CONFIG | Out-File -FilePath src/main/cluster-config.json -Encoding utf8 -NoNewline
        env:
          CLUSTER_CONFIG: ${{ secrets.CLUSTER_CONFIG }}

      # libimobiledevice для установки на iPhone (кладём в resources/tools).
      # Best-effort: если не скачалось, приложение всё равно соберётся и будет
      # качать .ipa, а ставить можно сторонним установщиком.
      - name: Bundle libimobiledevice (optional)
        shell: pwsh
        continue-on-error: true
        run: |
          # берём win-x64 zip из последнего релиза imobiledevice-net динамически
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/libimobiledevice-win32/imobiledevice-net/releases/latest" -Headers @{ "User-Agent" = "bmrng-ci" }
          $asset = $rel.assets | Where-Object { $_.name -like "*win-x64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "не нашёл win-x64 ассет" }
          Write-Host "качаю $($asset.name)"
          New-Item -ItemType Directory -Force resources/tools | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile tools.zip -TimeoutSec 180
          Expand-Archive -Path tools.zip -DestinationPath resources/tools -Force
          Get-ChildItem resources/tools -Recurse -Filter *.exe | Select-Object Name

      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmrng-setup
          path: release/*.exe
